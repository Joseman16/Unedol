<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra oculta</title>
    <link rel="stylesheet" href="styles/estilo_index.css">
</head>
<body>
    <header class="encabezado">
        <!-- Escudo de la institución  -->
        <div class="logo">
            <img id="logoPrincipal"/>
        </div>

        <!-- Barra de navegación -->
        <div class="navegacion">
            <nav class="menu-navegacion">
                <li class="lis"><a href="#inicio">Inicio</a></li>
                <li class="lis"><a href="#Galeria">Galeria</a></li>
                <li class="lis"><a href="#Historia">Historia</a></li>
                <li class="lis"><a href="#contacto">Contacto</a></li>
            </nav>
        </div>

        <!-- Contenido adicional o espacio para otros elementos como un GIF -->
        <!-- Contenedor del video -->
        <div class="cont_video">
            <video 
                id="video"
                src="img/index/Video_boy.mp4"
                autoplay
                loop
                muted
                playsinline>
            </video>
        </div>
    </header>

    <!-- Contenido principal de la página -->
    <main class="main">
        <section class="scene">

            <div class="bg-typography">
                
            </div>


            <div class="galeria-book-3d">

                <div class="galeria-book-3d__item" style="--i:0">
                    <img src="img/index/img1.webp">
                    <img src="img/index/img2.webp">
                </div>

                <div class="galeria-book-3d__item" style="--i:1">
                    <img src="img/index/img3.webp">
                    <img src="img/index/img4.webp">
                </div>

                <div class="galeria-book-3d__item" style="--i:2">
                    <img src="img/index/img5.webp">
                    <img src="img/index/img6.webp">
                </div>

                <div class="galeria-book-3d__item" style="--i:3">
                    <img src="img/index/img7.webp">
                    <img src="img/index/img8.webp">
                </div>

                <div class="galeria-book-3d__item" style="--i:4">
                    <img src="img/index/img9.webp">
                    <img src="img/index/img10.webp">
                </div>

            </div>

        </section>
        <script src="scripts/script_index.js"></script>
    </main>
    
</body>
</html>
